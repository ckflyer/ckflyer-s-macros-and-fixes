# =====================================================================
#  ckflyer's print macros for the Qidi Q2: PRINT_START, PRINT_END, ORCA_QIDI_BOX
#  Works with or without a Qidi Box (the Box steps only run when a Box is
#  enabled). The purge line is KAMP's LINE_PURGE (KAMP/Line_Purge.cfg).
#
#  OrcaSlicer machine start G-code:
#    ORCA_QIDI_BOX T=[initial_tool]          (Box only)
#    PRINT_START BED=[bed_temperature_initial_layer_single] HOTEND=[nozzle_temperature_initial_layer] CHAMBER=[chamber_temperature] EXTRUDER=[initial_no_support_extruder]
#    SET_PRINT_STATS_INFO TOTAL_LAYER=[total_layer_count]
#    M83
#    T[initial_tool]                          (Box only)
#  OrcaSlicer machine end G-code:
#    PRINT_END T=[current_extruder]
# =====================================================================

[gcode_macro PRINT_START]
# Originally based on Catsarecool700's QIDI-Q2-optimised-start-macro
gcode:
    {% set bedtemp = params.get('BED') | int %}
    {% set hotendtemp = params.get('HOTEND') | int %}
    {% set chambertemp = params.get('CHAMBER', 0) | int %}
    {% set extruder = params.EXTRUDER|default(0)|int %}

    DISABLE_ALL_SENSOR               # Filament runout sensor off during the start sequence
    CLEAR_PAUSE

    M104 S0
    M140 S{bedtemp}                  # Start heating the bed now (no wait)
    G28
    M141 S{chambertemp}              # Start heating the chamber now (no wait)
    SET_GCODE_OFFSET Z=0 MOVE=0

    # Qidi Box: reset load/runout state and load the first filament
    {% if printer.save_variables.variables.box_count >= 1 and printer["box_extras"] %}
        SAVE_VARIABLE VARIABLE=load_retry_num VALUE=0
        SAVE_VARIABLE VARIABLE=retry_step VALUE=None
        {% for i in range(16) %}
            SAVE_VARIABLE VARIABLE=runout_{i} VALUE=0
            G4 P100
        {% endfor %}
        {% if printer.save_variables.variables.enable_box == 1 %}
            BOX_PRINT_START EXTRUDER={extruder} HOTENDTEMP={hotendtemp}
            M400
            EXTRUSION_AND_FLUSH HOTEND={hotendtemp}
        {% endif %}
    {% endif %}

    CLEAR_NOZZLE HOTEND={hotendtemp} # Purge and wipe the nozzle in the chute
    M104 S150                        # Keep the nozzle cool for probing (no ooze)
    G4 P3000
    M400
    G28
    Z_TILT_ADJUST

    M190 S{bedtemp}                  # Wait for the bed
    M191 S{chambertemp}              # Wait for the chamber
    M400
    G4 P3000

    BED_MESH_CALIBRATE PROFILE=ADAPTIVE  # KAMP adaptive mesh of just the print area

    # Park above the purge line start while the nozzle heats. The nozzle stays
    # 5mm up so any ooze hangs in the air instead of sticking to the bed.
    G0 Z10 F600
    G0 X110 Y1 F10000
    G0 Z5 F600
    {% if printer.save_variables.variables.box_count >= 1 and printer["box_extras"] and printer.save_variables.variables.enable_box == 1 %}
        BUFFER_MONITORING ENABLE=1
    {% endif %}
    M109 S{hotendtemp}               # Wait for the nozzle
    M204 S10000

    set_zoffset
    ENABLE_ALL_SENSOR
    save_last_file
    LINE_PURGE                       # Purge line at the front of the bed

[gcode_macro PRINT_END]
gcode:
    {% set tool = params.T|default(-1)|int %}
    {% set z_now = printer.gcode_move.gcode_position.z %}
    {% set z_top = printer.toolhead.axis_maximum.z %}
    {% set z_mid = printer.toolhead.axis_maximum.z / 2 + 10 %}
    {% set z_lift = [z_now + 3, z_top]|min %}
    {% set z_park = [[z_now + 3, z_mid]|max, z_top]|min %}

    M400
    G1 E-3 F1800                     # Retract before moving
    G90
    G0 Z{z_lift} F600                # Lower the bed 3mm away from the print first
    M140 S0
    M141 S0

    # Qidi Box: cut and unload the filament (needs the nozzle hot)
    {% if tool >= 0 and printer["box_extras"] %}
        UNLOAD_FILAMENT T={tool}
    {% elif printer["box_extras"] and printer.save_variables.variables.enable_box == 1 %}
        M118 PRINT_END: no T= given, so the filament was left loaded. Use PRINT_END T=[current_extruder] in the slicer.
    {% endif %}

    G0 Y270 F12000                   # Park at the back
    G0 X90 F12000
    G0 Z{z_park} F600                # Lower the bed: to the middle, or 3mm more if already lower

    save_zoffset
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    CLEAR_PAUSE
    M106 P2 S0
    M106 P0 S0
    M106 P4 S0
    {% if 'DISABLE_BOX_HEATER' in printer.gcode.commands %}
        DISABLE_BOX_HEATER
    {% endif %}

    M104 S0
    M220 S100
    M221 S100
    M84

    DISABLE_ALL_SENSOR
    {% if printer.save_variables.variables.box_count >= 1 and printer.save_variables.variables.enable_box == 1 and printer["box_extras"] %}
        BUFFER_MONITORING ENABLE=0
    {% endif %}
    BED_MESH_CLEAR
    G31
    CLEAR_LAST_FILE
    BEEP I=2 DUR=500
    SDCARD_RESET_FILE

[gcode_macro ORCA_QIDI_BOX]
#ADDED
# Add to start gcode:  ORCA_QIDI_BOX T=[initial_tool]
# T0-3 for QIDI BOX slots 1A-1D.  If more boxes are connected,
# additional tools will be written in the same order.
# Any tool number higher than the configured box slots or -1 
# will disable the BOX and use the rack. 

gcode: 
    # Grab the inital tool number, save to variable t 
    {% set t = params.get('T') | int %}

    # Check if at least one BOX is connected
    {% if printer.save_variables.variables.box_count >= 1 %}

        # Check if initial tool is external spool (not in BOX)
        {% if t >= printer.save_variables.variables.box_count * 4 or t == -1 %}
            # Disable the BOX and desync any synced slots
            SAVE_VARIABLE VARIABLE=enable_box VALUE=0

        {% else %}
            # If initial tool is in range for BOX, enable the BOX
            SAVE_VARIABLE VARIABLE=enable_box VALUE=1

            # Set tools T0 through T3 to slot0 through slot3
            SAVE_VARIABLE VARIABLE=value_t0 VALUE="'slot0'"
            SAVE_VARIABLE VARIABLE=value_t1 VALUE="'slot1'"
            SAVE_VARIABLE VARIABLE=value_t2 VALUE="'slot2'"
            SAVE_VARIABLE VARIABLE=value_t3 VALUE="'slot3'"

            # If additional BOXes are connected, set those tools too
            {% if printer.save_variables.variables.box_count >= 2 %}
                SAVE_VARIABLE VARIABLE=value_t4 VALUE="'slot4'"
                SAVE_VARIABLE VARIABLE=value_t5 VALUE="'slot5'"
                SAVE_VARIABLE VARIABLE=value_t6 VALUE="'slot6'"
                SAVE_VARIABLE VARIABLE=value_t7 VALUE="'slot7'"
            {% endif %}

            {% if printer.save_variables.variables.box_count >= 3 %}
                SAVE_VARIABLE VARIABLE=value_t8 VALUE="'slot8'"
                SAVE_VARIABLE VARIABLE=value_t9 VALUE="'slot9'"
                SAVE_VARIABLE VARIABLE=value_t10 VALUE="'slot10'"
                SAVE_VARIABLE VARIABLE=value_t11 VALUE="'slot11'"
            {% endif %}

            {% if printer.save_variables.variables.box_count == 4 %}
                SAVE_VARIABLE VARIABLE=value_t12 VALUE="'slot12'"
                SAVE_VARIABLE VARIABLE=value_t13 VALUE="'slot13'"
                SAVE_VARIABLE VARIABLE=value_t14 VALUE="'slot14'"
                SAVE_VARIABLE VARIABLE=value_t15 VALUE="'slot15'"
            {% endif %}
        {% endif %}
    {% else %}
        # If no boxes are connected, disable the BOX
        SAVE_VARIABLE VARIABLE=enable_box VALUE=0
    {% endif %}
